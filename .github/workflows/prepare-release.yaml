name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@560223eaaf4a15385415c521564155a50653fa52
    permissions:
      contents: read
      pull-requests: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}
      changelog: docs/changelog.rst
      fragments: docs/changelog.d
      format: rst
